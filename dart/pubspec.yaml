name: apiverve_nameservers
description: "Nameservers queries authoritative DNS records for any domain to list its nameservers, IP addresses, and reverse DNS records. It detects multiple DNS providers, counts total nameservers, and identifies who runs each server."
version: 1.2.5
homepage: https://apiverve.com/marketplace/nameservers?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/nameservers-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
