openapi: 3.0.4
info:
  title: Nameservers
  description: >-
    Nameservers queries authoritative DNS records for any domain to list its
    nameservers, IP addresses, and reverse DNS records. It detects multiple DNS
    providers, counts total nameservers, and identifies who runs each server.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/nameservers:
    get:
      summary: Nameservers
      description: >-
        Get the authoritative nameservers for a domain including IP addresses
        and owner information.
      operationId: nameservers
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain name to lookup nameservers for
          example: google.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: google.com
                  nameserverCount: 4
                  hasMultipleProviders: false
                  nameservers:
                    - nameserver: ns1.google.com
                      ipAddresses:
                        - 216.239.32.10
                      reverseDns: ns1.google.com
                      owner: google.com
                    - nameserver: ns2.google.com
                      ipAddresses:
                        - 216.239.34.10
                      reverseDns: ns2.google.com
                      owner: google.com
                  uniqueOwners:
                    - google.com
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
